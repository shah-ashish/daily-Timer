<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Settings - Daily Timer</title>
  <link rel="stylesheet" href="css/tailwind.css">
  <script type="module" src="components/updater-component.js"></script>
</head>
<body class="min-h-screen px-4 pt-12 pb-24">

  <!-- Header: iOS Large Title -->
  <header class="mb-6">
    <h1 class="text-3xl font-bold tracking-tight text-neutral-900 dark:text-neutral-100">Settings</h1>
  </header>

  <main class="space-y-6">

    <!-- Section 1: Appearance & Notification Preferences -->
    <section class="space-y-2">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-neutral-500 dark:text-neutral-400 px-1">Preferences</h2>
      
      <div class="bg-white dark:bg-[#1C1C1E] rounded-2xl border border-neutral-200/80 dark:border-neutral-800 shadow-sm divide-y divide-neutral-100 dark:divide-neutral-800/80 overflow-hidden">
        
        <!-- Appearance Toggle -->
        <div class="flex items-center justify-between p-4">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-neutral-100 dark:bg-neutral-800 flex items-center justify-center text-neutral-700 dark:text-neutral-300">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
              </svg>
            </div>
            <span class="text-sm font-semibold text-neutral-800 dark:text-neutral-200">Appearance</span>
          </div>

          <!-- Segmented Control for Light / Dark -->
          <div class="inline-flex p-1 bg-neutral-100 dark:bg-neutral-800 rounded-xl" id="theme-segmented">
            <button id="theme-light" class="px-3 py-1 text-xs font-semibold rounded-lg bg-white dark:bg-neutral-700 shadow-sm text-neutral-900 dark:text-neutral-100 transition-all">Light</button>
            <button id="theme-dark" class="px-3 py-1 text-xs font-semibold rounded-lg text-neutral-500 dark:text-neutral-400 hover:text-neutral-800 dark:hover:text-neutral-200 transition-all">Dark</button>
          </div>
        </div>

        <!-- Notification Timer Before Task -->
        <div class="flex items-center justify-between p-4">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-orange-50 dark:bg-orange-950/40 flex items-center justify-center text-[#FF5722]">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
              </svg>
            </div>
            <div>
              <span class="text-sm font-semibold text-neutral-800 dark:text-neutral-200 block">Notification Reminder</span>
              <span class="text-[11px] text-neutral-400 font-medium">Alert before task start</span>
            </div>
          </div>

          <!-- Notification Timer Selector -->
          <div class="inline-flex p-1 bg-neutral-100 dark:bg-neutral-800 rounded-xl" id="notif-segmented">
            <button data-mins="5" class="notif-btn px-2.5 py-1 text-xs font-medium rounded-lg text-neutral-500 hover:text-neutral-800 transition-all">5m</button>
            <button data-mins="10" class="notif-btn px-2.5 py-1 text-xs font-semibold rounded-lg bg-white dark:bg-neutral-700 shadow-sm text-neutral-900 dark:text-neutral-100 transition-all">10m</button>
            <button data-mins="15" class="notif-btn px-2.5 py-1 text-xs font-medium rounded-lg text-neutral-500 hover:text-neutral-800 transition-all">15m</button>
            <button data-mins="30" class="notif-btn px-2.5 py-1 text-xs font-medium rounded-lg text-neutral-500 hover:text-neutral-800 transition-all">30m</button>
          </div>
        </div>

      </div>
    </section>

    <!-- Section 2: About & Self-Update Engine (Imported Independent Component) -->
    <section class="space-y-2">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-neutral-500 dark:text-neutral-400 px-1">About & Updates</h2>
      
      <!-- Custom Element imported from updater-component.js -->
      <daily-timer-updater></daily-timer-updater>
    </section>

  </main>

  <!-- iOS Bottom Tab Bar (Settings Active) -->
  <nav class="fixed bottom-0 left-0 right-0 h-16 bg-white/90 dark:bg-[#1C1C1E]/90 backdrop-blur-md border-t border-neutral-200/80 dark:border-neutral-800 flex items-center justify-around px-2 z-50">
    <div class="flex flex-col items-center gap-0.5 text-neutral-400 hover:text-neutral-600 cursor-pointer">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span class="text-[10px] font-medium">Home</span>
    </div>

    <div class="flex flex-col items-center gap-0.5 text-neutral-400 hover:text-neutral-600 cursor-pointer">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
      <span class="text-[10px] font-medium">Tasks</span>
    </div>

    <div class="flex flex-col items-center gap-0.5 text-neutral-400 hover:text-neutral-600 cursor-pointer">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span class="text-[10px] font-medium">Create</span>
    </div>

    <!-- Active Tab: Settings -->
    <div class="flex flex-col items-center gap-0.5 text-[#FF5722] cursor-pointer">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span class="text-[10px] font-semibold">Settings</span>
    </div>
  </nav>

  <script>
    // Theme switching logic
    const themeLight = document.getElementById('theme-light');
    const themeDark = document.getElementById('theme-dark');
    
    function setTheme(dark) {
      if (dark) {
        document.documentElement.classList.add('dark');
        themeDark.classList.add('bg-neutral-700', 'shadow-sm', 'text-neutral-100');
        themeDark.classList.remove('text-neutral-400');
        themeLight.classList.remove('bg-white', 'shadow-sm', 'text-neutral-900');
        themeLight.classList.add('text-neutral-500');
      } else {
        document.documentElement.classList.remove('dark');
        themeLight.classList.add('bg-white', 'shadow-sm', 'text-neutral-900');
        themeLight.classList.remove('text-neutral-500');
        themeDark.classList.remove('bg-neutral-700', 'shadow-sm', 'text-neutral-100');
        themeDark.classList.add('text-neutral-400');
      }
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }

    themeLight.addEventListener('click', () => setTheme(false));
    themeDark.addEventListener('click', () => setTheme(true));

    // Notification reminder duration selector
    const notifButtons = document.querySelectorAll('.notif-btn');
    notifButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        notifButtons.forEach(b => {
          b.classList.remove('bg-white', 'dark:bg-neutral-700', 'shadow-sm', 'text-neutral-900', 'dark:text-neutral-100', 'font-semibold');
          b.classList.add('text-neutral-500', 'font-medium');
        });
        btn.classList.add('bg-white', 'dark:bg-neutral-700', 'shadow-sm', 'text-neutral-900', 'dark:text-neutral-100', 'font-semibold');
        btn.classList.remove('text-neutral-500', 'font-medium');
        localStorage.setItem('notif_lead_time', btn.dataset.mins);
      });
    });

    // Initialize saved preferences
    if (localStorage.getItem('theme') === 'dark' || window.matchMedia('(prefers-color-scheme: dark)').matches) {
      setTheme(true);
    }
  </script>
</body>
</html>
